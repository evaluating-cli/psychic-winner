[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elevation-route"
version = "1.0.0"
description = "Least-cost route planner between two points that strongly penalises elevation change."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["elevation", "dem", "routing", "least-cost-path", "terrain", "a-star", "gis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.22",
    "requests>=2.27",
    "pillow>=9.0",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
elevation-route = "elevation_route.cli:main"

[project.urls]
Homepage = "https://github.com/evaluating-cli/psychic-winner"

[tool.hatch.build.targets.wheel]
packages = ["src/elevation_route"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
